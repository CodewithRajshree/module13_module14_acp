
<!DOCTYPE html>
<html>
<body>
    <h2>JavaScript Objects Data Structure and Array</h2>

    <script>
        var student = {
            name: 'Rajshree',
            age: '12',
            Grade: '7',
            hobbies: 'damcing and coding',
            fav_sport: 'Gymnastics'
        };

        var color = ["white", "black", "red", "pink", "purple"];

        document.write("Student name is : " + student.name,
            "<br>",
            "Student favorite sport is : " + student.fav_sport);

        document.write("<br>Before Poping the colors are: " + color.join("^"));

        document.write("<br>My favorite color is : " + color[2]);

        color.pop();

        document.write("<br>After Poping the colors are : " + color.join("*"));
    </script>
</body>
</html>
